
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer & Class Scheduler</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4fa;
            color: #26334a;
        }

        header {
            background: #263d70;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 15px;
        }

        .layout {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            min-width: 0;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #d9e0ec;
        }

        h2 {
            color: #263d70;
        }

        .timer {
            text-align: center;
            background: #edf1ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        #clock {
            font-size: 48px;
            font-weight: bold;
            color: #5145cd;
            margin: 12px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd3e2;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            border: none;
            padding: 11px 15px;
            margin: 5px 3px 0 0;
            border-radius: 7px;
            background: #5145cd;
            color: white;
            cursor: pointer;
        }

        .pause {
            background: #e19a35;
        }

        .reset {
            background: #697386;
        }

        .add {
            background: #167d70;
            width: 100%;
            margin-top: 15px;
        }

        #timerStatus, #classStatus {
            color: #5145cd;
            font-weight: bold;
            margin-top: 15px;
        }

        .event {
            padding: 12px;
            margin-top: 12px;
            border-left: 4px solid #5145cd;
            background: #f7f7ff;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .event strong, .event small {
            display: block;
            margin-bottom: 5px;
        }

        .delete {
            background: #d84c58;
        }

        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
            }

            #clock {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Study Timer & Class Scheduler</h1>
    <p>Manage your study sessions and class reminders</p>
</header>

<div class="container">
    <div class="layout">

        <section class="card">
            <h2>⏳ Countdown Timer</h2>

            <label for="duration">Duration in minutes</label>
            <input type="number" id="duration" min="1" max="1440" value="1">

            <div class="timer">
                <div>Time Remaining</div>
                <div id="clock">01:00</div>
                <div id="timerStatus">Ready to start</div>
            </div>

            <button id="startButton">Start</button>
            <button id="pauseButton" class="pause">Pause</button>
            <button id="resetButton" class="reset">Reset</button>
        </section>

        <section class="card">
            <h2>🗓️ Class Scheduler</h2>

            <label for="className">Class or Activity</label>
            <input type="text" id="className" placeholder="e.g. JavaScript Lecture">

            <label for="classTime">Start Time</label>
            <input type="time" id="classTime">

            <button id="addClassButton" class="add">+ Add Class</button>

            <div id="classStatus">Your schedule</div>
            <div id="classList">No classes added yet.</div>
        </section>

    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
